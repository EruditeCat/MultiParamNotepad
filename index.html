<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线笔记</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fff;
  }
  .toolbar {
    padding: 8px 16px;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    color: #666;
    background: #fafafa;
  }
  .status { display: flex; gap: 12px; align-items: center; }
  .saved { color: #52c41a; }
  .saving { color: #faad14; }
  textarea {
    flex: 1;
    width: 100%;
    border: none;
    outline: none;
    padding: 24px 32px;
    font-size: 16px;
    line-height: 1.7;
    resize: none;
    font-family: inherit;
  }
</style>
</head>
<body>
  <div class="toolbar">
    <div><strong id="noteName">默认笔记</strong></div>
    <div class="status">
      <span id="count">0 字</span>
      <span id="saveStatus" class="saved">已保存</span>
    </div>
  </div>
  <textarea id="editor" placeholder="开始输入..."></textarea>

<script>
  (function() {
    var params = new URLSearchParams(location.search);
    var noteId = params.toString() || 'default';
    var storageKey = 'onlinenote:' + noteId;

    var displayName = noteId === 'default' ? '默认笔记' : noteId;
    document.getElementById('noteName').textContent = displayName;
    document.title = displayName + ' - 在线笔记';

    var editor = document.getElementById('editor');
    var saveStatus = document.getElementById('saveStatus');
    var countEl = document.getElementById('count');

    var saved = localStorage.getItem(storageKey);
    if (saved !== null) {
      editor.value = saved;
    }

    function updateCount() {
      countEl.textContent = editor.value.length + ' 字';
    }
    updateCount();

    var saveTimer = null;
    editor.addEventListener('input', function() {
      updateCount();
      saveStatus.textContent = '保存中...';
      saveStatus.className = 'saving';
      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(function() {
        localStorage.setItem(storageKey, editor.value);
        saveStatus.textContent = '已保存';
        saveStatus.className = 'saved';
      }, 300);
    });

    window.addEventListener('storage', function(e) {
      if (e.key === storageKey && e.newValue !== editor.value) {
        editor.value = e.newValue || '';
        updateCount();
      }
    });
  })();
</script>
</body>
</html>
